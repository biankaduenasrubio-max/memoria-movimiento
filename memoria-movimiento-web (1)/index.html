<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOVIMIENTO · Memoria digital · Bianka Dueñas Rubio</title>
<meta name="description" content="Memoria del proyecto de grado MOVIMIENTO: un sistema para dar el primer paso. Bianka Dueñas Rubio · Diseño de Comunicación Visual · Pontificia Universidad Javeriana Cali · 2026-2.">
<meta property="og:title" content="MOVIMIENTO · Memoria digital">
<meta property="og:description" content="Un sistema para dar el primer paso. Bianka Dueñas Rubio · Diseño de Comunicación Visual · PUJ Cali · 2026-2.">
<meta property="og:image" content="pages/03.jpg">
<meta name="theme-color" content="#fcdce1">
<link rel="icon" href="img/favicon.png">
<style>
/* VOICE: tierno y cuidado, como hojear un libro hecho a mano.
   IDEA: la memoria impresa de MOVIMIENTO sobre una mesa rosada.
   PICTURE: el libro mismo, grande, que se pasa con el dedo.
   COLOUR and TYPE: rosado claro #fcdce1, rosa #e386ae, vino #9d4751; Skate para la frase, Avenir/sistema para controles.
   LAYOUT: barra fina arriba, libro centrado ocupando todo, controles abajo y tira de miniaturas plegable. */
@font-face{font-family:Skate;src:url(fonts/Skate.ttf) format("truetype");font-display:swap}
:root{color-scheme:light dark;
  --bg:light-dark(#fcdce1,#2b1d21);--ink:light-dark(#3b2a2e,#fbe7ec);--vino:light-dark(#9d4751,#f3a6c4);
  --rosa:#e386ae;--chip:light-dark(#fff,#3d2a30);--line:light-dark(#efb9c9,#5a3c45);--shadow:light-dark(rgba(157,71,81,.28),rgba(0,0,0,.55))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;overflow:hidden;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;
  background-image:radial-gradient(ellipse at 50% 55%,light-dark(rgba(255,255,255,.75),rgba(227,134,174,.10)),transparent 65%)}
header{display:flex;align-items:center;gap:14px;padding:12px max(3vw,14px);flex-wrap:wrap}
header img{height:26px;width:auto}
header .who{display:flex;flex-direction:column;line-height:1.2}
header .who b{color:var(--vino);font-size:14px}
header .who span{font-size:13px;opacity:.75}
header .phrase{margin-inline-start:auto;font-family:Skate,cursive;color:var(--vino);font-size:18px}
#stage{position:relative;display:grid;place-items:center;padding:8px max(2vw,10px)}
#bookWrap{position:relative;width:100%;transition:transform .6s ease}
#book{margin:0 auto}
.page{background:#fefcf3;overflow:hidden}
.page img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.stf__parent{filter:drop-shadow(0 18px 30px var(--shadow))}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-family:Skate,cursive;color:var(--vino);font-size:22px}
.side{position:absolute;top:50%;translate:0 -50%;width:48px;height:48px;border-radius:50%;border:0;background:var(--chip);color:var(--vino);
  font-size:26px;line-height:1;cursor:pointer;box-shadow:0 4px 14px var(--shadow);z-index:5;display:grid;place-items:center}
.side.prev{left:max(1vw,6px)}.side.next{right:max(1vw,6px)}
.side:disabled{opacity:.3;cursor:default}
nav.bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 14px 12px;flex-wrap:wrap}
nav.bar button,nav.bar a.btn{display:inline-grid;place-items:center;text-decoration:none;min-height:44px;min-width:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--chip);color:var(--vino);
  font:600 14px/1 inherit;font-family:inherit;cursor:pointer}
nav.bar a.btn:focus-visible{outline:3px solid var(--vino);outline-offset:2px}
nav.bar button[aria-pressed=true]{background:var(--rosa);border-color:var(--rosa);color:#fff}
button:focus-visible{outline:3px solid var(--vino);outline-offset:2px}
#count{min-width:96px;text-align:center;font-weight:600;color:var(--vino);font-variant-numeric:tabular-nums}
#hint{text-align:center;font-size:13px;opacity:.75;padding:0 14px 6px;display:none}
#thumbs{display:none;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px max(3vw,14px) 14px;border-top:1px solid var(--line)}
#thumbs.open{display:flex}
#thumbs button{flex:none;scroll-snap-align:start;border:2px solid transparent;border-radius:6px;padding:0;background:none;cursor:pointer;width:112px}
#thumbs button img{width:100%;display:block;border-radius:4px;aspect-ratio:612/396;object-fit:cover}
#thumbs button span{display:block;font-size:12px;color:var(--vino);text-align:center;padding-top:3px}
#thumbs button.on{border-color:var(--rosa)}
body.full header{display:none}
@media(max-width:900px){header .phrase{display:none}}
@media(max-height:480px){header{display:none}nav.bar{padding:4px 10px 6px}}
@media(prefers-reduced-motion:reduce){#bookWrap{transition:none}}
@media(max-width:700px){#hint{display:block}.side{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <img src="img/logo.png" alt="MOVIMIENTO">
  <div class="who"><b>Memoria · Proyecto de grado 2026-2</b><span>Bianka Dueñas Rubio · Diseño de Comunicación Visual · PUJ Cali</span></div>
  <div class="phrase">Un sistema para dar el primer paso</div>
</header>
<main id="stage">
  <button class="side prev" id="prev" aria-label="Página anterior">‹</button>
  <div id="bookWrap"><div id="book"></div><div id="loading">Abriendo el libro…</div></div>
  <button class="side next" id="next" aria-label="Página siguiente">›</button>
</main>
<div id="hint">Gira tu celular para verlo más grande · desliza para pasar la página</div>
<nav class="bar">
  <button id="first" aria-label="Ir a la portada">Portada</button>
  <button id="prev2" aria-label="Página anterior">‹</button>
  <div id="count" aria-live="polite">1 / 40</div>
  <button id="next2" aria-label="Página siguiente">›</button>
  <button id="tg" aria-pressed="false" aria-controls="thumbs">Páginas</button>
  <button id="fs">Pantalla completa</button>
  <a class="btn" href="MOVIMIENTO_memoria_BiankaDuenas.pdf" download>Descargar PDF</a>
</nav>
<div id="thumbs" aria-label="Todas las páginas"></div>

<script src="js/page-flip.browser.js"></script>
<script>
{
const N = 40, PW = 612, PH = 396;
const pad = n => String(n).padStart(2, '0');
const book = document.getElementById('book');
const wrap = document.getElementById('bookWrap');
const stage = document.getElementById('stage');
const count = document.getElementById('count');
const thumbs = document.getElementById('thumbs');

book.innerHTML = Array.from({length: N}, (_, i) =>
  `<div class="page"${i === 0 || i === N - 1 ? ' data-density="hard"' : ''}><img src="pages/${pad(i + 1)}.jpg" alt="Página ${i + 1}" draggable="false"></div>`).join('');
thumbs.innerHTML = Array.from({length: N}, (_, i) =>
  `<button data-i="${i}" aria-label="Ir a la página ${i + 1}"><img src="thumbs/${pad(i + 1)}.jpg" alt="" loading="lazy"><span>${i + 1}</span></button>`).join('');

function fit() {
  const r = stage.getBoundingClientRect();
  const availW = r.width - (innerWidth > 700 ? 130 : 20), availH = r.height - 16;
  const portrait = availW < 640;
  const ratio = portrait ? PW / PH : 2 * PW / PH;
  wrap.style.width = Math.max(260, Math.min(availW, availH * ratio)) + 'px';
}
fit();

const pf = new St.PageFlip(book, {
  width: PW, height: PH, size: 'stretch',
  minWidth: 240, maxWidth: 1400, minHeight: 155, maxHeight: 906,
  showCover: true, usePortrait: true, mobileScrollSupport: false,
  maxShadowOpacity: .45, flippingTime: 700, drawShadow: true, autoSize: true
});
pf.loadFromHTML(document.querySelectorAll('#book .page'));
document.getElementById('loading').remove();

function label(i) {
  if (pf.getOrientation() === 'portrait' || i === 0 || i === N - 1) return `${i + 1} / ${N}`;
  const a = i % 2 ? i : i - 1;
  return `${a + 1}–${a + 2} / ${N}`;
}
function update() {
  const i = pf.getCurrentPageIndex();
  count.textContent = label(i);
  const atStart = i === 0, atEnd = i >= N - 1 || (pf.getOrientation() !== 'portrait' && i >= N - 2);
  for (const id of ['prev', 'prev2']) document.getElementById(id).disabled = atStart;
  for (const id of ['next', 'next2']) document.getElementById(id).disabled = atEnd;
  thumbs.querySelectorAll('button').forEach((b, k) => b.classList.toggle('on', k === i || (pf.getOrientation() !== 'portrait' && i % 2 && k === i + 1)));
  const land = pf.getOrientation() !== 'portrait';
  const half = (pf.getBoundsRect() || {pageWidth: 0}).pageWidth / 2;
  wrap.style.transform = land && i === 0 ? `translateX(${-half}px)` : land && i >= N - 1 ? `translateX(${half}px)` : 'none';
  try { history.replaceState(null, '', '#pagina-' + (i + 1)); } catch (e) {}
}
pf.on('flip', update);
pf.on('changeOrientation', () => { update(); });

const go = n => { pf.flip(Math.max(0, Math.min(N - 1, n))); };
document.getElementById('prev').onclick = document.getElementById('prev2').onclick = () => pf.flipPrev();
document.getElementById('next').onclick = document.getElementById('next2').onclick = () => pf.flipNext();
document.getElementById('first').onclick = () => pf.turnToPage(0) || update();
thumbs.addEventListener('click', e => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  pf.turnToPage(+b.dataset.i); update();
});
const tg = document.getElementById('tg');
tg.onclick = () => {
  const open = thumbs.classList.toggle('open');
  tg.setAttribute('aria-pressed', open);
  requestAnimationFrame(() => { fit(); pf.update(); const on = thumbs.querySelector('.on'); on && on.scrollIntoView({inline: 'center', block: 'nearest'}); });
};
const fsb = document.getElementById('fs');
fsb.onclick = async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch (e) {
    document.body.classList.toggle('full');
    requestAnimationFrame(() => { fit(); pf.update(); });
  }
};
document.addEventListener('fullscreenchange', () => {
  const on = !!document.fullscreenElement;
  document.body.classList.toggle('full', on);
  fsb.textContent = on ? 'Salir' : 'Pantalla completa';
  setTimeout(() => { fit(); pf.update(); }, 60);
});
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') pf.flipNext();
  if (e.key === 'ArrowLeft') pf.flipPrev();
});
const ro = new ResizeObserver(() => { fit(); requestAnimationFrame(update); });
ro.observe(stage);

const m = /^#pagina-(\d+)$/.exec(location.hash);
if (m) pf.turnToPage(Math.max(0, Math.min(N - 1, +m[1] - 1)));
wrap.style.transition = 'none';
update();
requestAnimationFrame(() => requestAnimationFrame(() => { wrap.style.transition = ''; }));
}
</script>
</body>
</html>
